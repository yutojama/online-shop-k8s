apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: portshop/order-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: order-service-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 4003