apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: portshop/payment-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payment-service-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 4004