apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      containers:
        - name: shipping-service
          image: portshop/shipping-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shipping-service-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 4005