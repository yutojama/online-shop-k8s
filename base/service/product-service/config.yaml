apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
data:
  FRONTEND_URL: "http://portshop-frontend:80"
  IMAGE_URI: "/app/images"
  KEYCLOAK_CLIENT_ID: "portshop-admin"
  KEYCLOAK_REALM: "portshop-realm"
  KEYCLOAK_SERVER_URL: "http://portshop-keycloak:8080"
  SPRING_DATASOURCE_PASSWORD: "password"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://product-service-db:5432/db"
  SPRING_DATASOURCE_USERNAME: "admin_user"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_SQL_INIT_MODE: "always"
  USER_SERVICE_URL: "http://user-service:4002"
  
  