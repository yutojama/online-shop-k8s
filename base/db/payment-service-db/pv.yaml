apiVersion: v1
kind: PersistentVolume
metadata:
  name: payment-service-db-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /var/lib/portshop-database/payment-service-db
    type: Directory