apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-service-db-statefulset

spec:
  serviceName: product-service-db-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: product-service-db
  template:
    metadata:
      labels:
        app: product-service-db
    spec:
      containers:
        - name: product-service-db
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: product-service-db-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 5432
          volumeMounts:
            - name: product-service-db
              mountPath: /var/lib/postgresql

      volumes:
        - name: product-service-db
          persistentVolumeClaim:
            claimName: product-service-db-pvc