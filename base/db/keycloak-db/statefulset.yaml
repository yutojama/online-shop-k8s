apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db-statefulset

spec:
  serviceName: keycloak-db-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db

  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
        - name: keycloak-db
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: keycloak-db-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 5432
          volumeMounts:
            - name: keycloak-db
              mountPath: /var/lib/postgresql

      volumes:
        - name: keycloak-db
          persistentVolumeClaim:
            claimName: keycloak-db-pvc