apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-token-db-statefulset

spec:
  serviceName: auth-token-db-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: auth-token-db

  template:
    metadata:
      labels:
        app: auth-token-db
    spec:
      containers:
        - name: auth-token-db
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: auth-token-db-config
          ports:  # only for documentation and visibility at kubectl describe
            - containerPort: 5432
          volumeMounts:
            - name: auth-token-db
              mountPath: /var/lib/postgresql

      volumes:
        - name: auth-token-db
          persistentVolumeClaim:
            claimName: auth-token-db-pvc

